name: Decompile DonutOrder

on:
  push:
    paths:
      - "DH-Giftcode-1.7.3-1.jar"
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decompile bằng Vineflower
        run: |
          curl -L -o vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir output
          java -jar vf.jar "DH-Giftcode-1.7.3-1.jar" output

      - name: Bỏ code thư viện bên thứ ba (sqlite/slf4j/hikari)
        run: |
          rm -rf output/org/sqlite output/org/slf4j output/com/zaxxer
          cd output && zip -r ../code-source.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: code-source
          path: code-source.zip

name: Decompile with Procyon

# Đặt file này tại: .github/workflows/decompile-jar.yml
# Đặt file jar tại: input/EconomyV2.jar (hoặc đổi jar_path khi chạy)
# Chạy tay: tab Actions -> "Decompile with Procyon" -> Run workflow

on:
  workflow_dispatch:
    inputs:
      jar_path:
        description: "Đường dẫn file .jar trong repo"
        required: true
        default: "input/EconomyV2.jar"
      search:
        description: "Regex (không phân biệt hoa thường) để tìm trong class và source"
        required: true
        default: "nulled|cracked by|licen[sc]e|findProduct"

permissions:
  contents: read

env:
  PROCYON_VERSION: "0.6.0"

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Kiểm tra file jar
        env:
          JAR_PATH: ${{ inputs.jar_path }}
        run: |
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::Không thấy file: $JAR_PATH"
            echo "Các file .jar có trong repo:"
            find . -name '*.jar' -not -path './.git/*'
            echo "Thư mục gốc:"; ls -la
            exit 1
          fi
          ls -l "$JAR_PATH"

      - name: Tải Procyon
        run: |
          curl -fsSL --retry 3 -o procyon.jar \
            "https://github.com/mstrobel/procyon/releases/download/v${PROCYON_VERSION}/procyon-decompiler-${PROCYON_VERSION}.jar"
          java -jar procyon.jar --version || true

      - name: Decompile
        env:
          JAR_PATH: ${{ inputs.jar_path }}
        run: |
          mkdir -p out/src
          java -jar procyon.jar -jar "$JAR_PATH" -o out/src || echo "::warning::Procyon trả về lỗi, vẫn tiếp tục báo cáo"
          echo "Số file .java: $(find out/src -name '*.java' | wc -l)"

      - name: Tìm chuỗi trong class và source
        env:
          JAR_PATH: ${{ inputs.jar_path }}
          SEARCH: ${{ inputs.search }}
        run: |
          mkdir -p /tmp/classes
          unzip -q "$JAR_PATH" -d /tmp/classes

          in_class=$(grep -rlaEi -- "$SEARCH" /tmp/classes | sed 's#^/tmp/classes/##' | head -100 || true)
          in_src=$(grep -rnEi -- "$SEARCH" out/src | cut -c1-240 | head -200 || true)
          failed=$(grep -rl "could not be decompiled" out/src | head -100 || true)

          {
            echo "## Kết quả tìm: \`$SEARCH\`"
            echo
            echo "### File .class chứa chuỗi ở dạng chữ thường (chưa mã hóa)"
            echo '```'
            echo "${in_class:-(không có)}"
            echo '```'
            echo "### Trong source đã decompile"
            echo '```'
            echo "${in_src:-(không có)}"
            echo '```'
            echo "### Class/method Procyon không decompile được"
            echo '```'
            echo "${failed:-(không có)}"
            echo '```'
            echo
            echo "> Nếu không ra gì: chuỗi có thể bị mã hóa (XOR/AES) và chỉ giải mã lúc chạy."
          } | tee out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: procyon-output
          path: |
            out/src
            out/report.md
          retention-days: 7
